<!--
  The browser tab icon: the same hourglass as Logo.jsx.

  One difference, and it is on purpose. A favicon is fetched by the browser as a
  standalone file, outside our page, so it cannot see our CSS variables -- there
  is no --color-brand-start for it to look up. The three colours are therefore
  written out here. This is the one place in the project a colour code lives
  outside index.css, and if the gradient ever changes, this file has to be
  changed by hand to match.

  The stroke is a little thicker than the in-app logo. At 16 pixels in a tab a
  2px line starts to disappear.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>
  </defs>
  <path
    d="M6 3h12l-6 9 6 9H6l6-9z"
    stroke="url(#brand)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
